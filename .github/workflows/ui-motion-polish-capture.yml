name: UI motion polish capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture centered polish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-motion-polish
          COOLPATH_MODE=mock DATABASE_URL=:memory: pnpm --filter @coolpath/api dev >/tmp/api.log 2>&1 &
          pnpm --filter @coolpath/web dev --host 127.0.0.1 >/tmp/web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/api.log; cat /tmp/web.log; exit 1; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await desktop.request.post('http://127.0.0.1:8787/api/demo/reset');
            await desktop.goto('http://127.0.0.1:5173');
            await desktop.getByRole('heading', { name: /cooling locations/i }).waitFor();
            await desktop.waitForTimeout(700);
            await desktop.screenshot({ path: 'ui-motion-polish/public-1440.png', fullPage: true });
            await desktop.goto('http://127.0.0.1:5173/?view=technical');
            await desktop.getByRole('heading', { name: 'Source integrity' }).waitFor();
            await desktop.waitForTimeout(700);
            await desktop.screenshot({ path: 'ui-motion-polish/technical-1440.png', fullPage: true });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            await mobile.goto('http://127.0.0.1:5173');
            await mobile.getByRole('heading', { name: /cooling locations/i }).waitFor();
            await mobile.waitForTimeout(700);
            await mobile.screenshot({ path: 'ui-motion-polish/public-390.png', fullPage: false });
            await mobile.goto('http://127.0.0.1:5173/?view=technical');
            await mobile.getByRole('heading', { name: 'Source integrity' }).waitFor();
            await mobile.waitForTimeout(700);
            await mobile.screenshot({ path: 'ui-motion-polish/technical-390.png', fullPage: false });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: coolpath-ui-motion-polish
          path: ui-motion-polish
          if-no-files-found: error
