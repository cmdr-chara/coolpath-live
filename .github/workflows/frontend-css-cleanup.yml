name: Frontend CSS cleanup

on:
  push:
    branches: [frontend/reference-led-redesign]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Consolidate final frontend styles') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - name: Consolidate final cascade layers
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = Path('apps/web/src/styles')
          concept = styles / 'concept.css'
          refine = styles / 'concept-refine.css'
          distill = styles / 'distill.css'

          merged = concept.read_text().rstrip() + '\n\n' + refine.read_text().strip() + '\n\n' + distill.read_text().strip() + '\n'
          concept.write_text(merged)
          refine.unlink()
          distill.unlink()

          entry = Path('apps/web/src/styles.css')
          lines = [
              line for line in entry.read_text().splitlines()
              if 'concept-refine.css' not in line and 'distill.css' not in line
          ]
          entry.write_text('\n'.join(lines) + '\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/frontend-css-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css apps/web/src/styles/concept.css
          git add -u apps/web/src/styles
          git commit -m "Consolidate final frontend styles"
          git push origin HEAD:frontend/reference-led-redesign
