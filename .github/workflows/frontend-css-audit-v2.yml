name: Precise frontend CSS audit

on:
  push:
    branches: [frontend/reference-led-redesign]

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'Record precise frontend CSS audit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - name: Find precisely unreferenced CSS classes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = '\n'.join(
              p.read_text(errors='ignore')
              for p in Path('apps/web/src').rglob('*')
              if p.suffix in {'.tsx', '.ts'}
          )
          css = '\n'.join(p.read_text(errors='ignore') for p in Path('apps/web/src/styles').glob('*.css'))
          classes = sorted(set(re.findall(r'\.([A-Za-z_][A-Za-z0-9_-]*)', css)))

          def exact(name: str) -> bool:
              return re.search(rf'(?<![A-Za-z0-9_-]){re.escape(name)}(?![A-Za-z0-9_-])', source) is not None

          def dynamic_modifier(name: str) -> bool:
              if '--' not in name:
                  return False
              base = name.split('--', 1)[0] + '--'
              return (base + '${') in source

          dead = [name for name in classes if not exact(name) and not dynamic_modifier(name)]
          Path('apps/web/CSS-AUDIT-V2.tmp').write_text(
              f'CSS classes: {len(classes)}\nUnreferenced candidates: {len(dead)}\n\n' + '\n'.join(dead) + '\n'
          )
          PY
      - name: Commit report and remove one-shot workflow
        run: |
          git rm .github/workflows/frontend-css-audit-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/CSS-AUDIT-V2.tmp
          git commit -m "Record precise frontend CSS audit"
          git push origin HEAD:frontend/reference-led-redesign
