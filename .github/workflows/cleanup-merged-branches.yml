name: Cleanup merged branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only branches already contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            'agent/best-clean-code-polish'
            'agent/submission-proof'
            'backend/jury-ready-hardening'
            'frontend/jury-ready-redesign'
          )
          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              echo "Already absent: ${branch}"
              continue
            fi
            if ! git merge-base --is-ancestor "origin/${branch}" origin/main; then
              echo "Refusing to delete non-merged branch: ${branch}" >&2
              exit 1
            fi
            git push origin --delete "${branch}"
          done
