name: Frontend CSS dead-code audit

on:
  push:
    branches: [frontend/reference-led-redesign]

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'Record frontend CSS audit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - name: Find unreferenced CSS classes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = '\n'.join(
              p.read_text(errors='ignore')
              for p in Path('apps/web/src').rglob('*')
              if p.suffix in {'.tsx', '.ts'}
          )
          css = '\n'.join(p.read_text(errors='ignore') for p in Path('apps/web/src/styles').glob('*.css'))
          classes = sorted(set(re.findall(r'\.([A-Za-z_][A-Za-z0-9_-]*)', css)))

          def referenced(name: str) -> bool:
              if name in source:
                  return True
              if '--' in name and name.split('--', 1)[0] + '--' in source:
                  return True
              return False

          dead = [name for name in classes if not referenced(name)]
          report = [
              f'CSS classes: {len(classes)}',
              f'Unreferenced candidates: {len(dead)}',
              '',
              *dead,
              ''
          ]
          Path('apps/web/CSS-AUDIT.tmp').write_text('\n'.join(report))
          PY
      - name: Commit report and remove one-shot workflow
        run: |
          git rm .github/workflows/frontend-css-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/CSS-AUDIT.tmp
          git commit -m "Record frontend CSS audit"
          git push origin HEAD:frontend/reference-led-redesign
