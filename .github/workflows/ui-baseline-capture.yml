name: UI baseline capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start mock app and capture visual QA matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-baseline

          COOLPATH_MODE=mock DATABASE_URL=:memory: pnpm --filter @coolpath/api dev > /tmp/coolpath-api.log 2>&1 &
          pnpm --filter @coolpath/web dev --host 127.0.0.1 > /tmp/coolpath-web.log 2>&1 &

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/coolpath-api.log || true
              cat /tmp/coolpath-web.log || true
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('@playwright/test');

          (async () => {
            const browser = await chromium.launch();
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

            await desktop.request.post('http://127.0.0.1:8787/api/demo/reset');
            await desktop.goto('http://127.0.0.1:5173');
            await desktop.getByRole('heading', { name: /cooling locations/i }).waitFor();
            await desktop.screenshot({ path: 'ui-baseline/public-1440.png', fullPage: true });

            await desktop.getByRole('searchbox').fill('Harbour');
            await desktop.getByText('1 of 3 verified records match your search').waitFor();
            await desktop.screenshot({ path: 'ui-baseline/public-search-1440.png', fullPage: true });
            await desktop.getByRole('searchbox').fill('');

            const evidenceButton = desktop.getByRole('button', { name: /view evidence/i }).first();
            await evidenceButton.click();
            await desktop.getByRole('dialog').waitFor();
            await desktop.screenshot({ path: 'ui-baseline/public-evidence-1440.png', fullPage: true });
            await desktop.keyboard.press('Escape');

            await desktop.goto('http://127.0.0.1:5173/?view=technical');
            await desktop.getByRole('heading', { name: 'Source integrity' }).waitFor();
            await desktop.screenshot({ path: 'ui-baseline/technical-healthy-1440.png', fullPage: true });

            await desktop.getByRole('button', { name: /Simulate drift/ }).click();
            await desktop.getByLabel('Quarantine branch').getByText('Candidate quarantined').waitFor();
            await desktop.screenshot({ path: 'ui-baseline/technical-drift-1440.png', fullPage: true });

            await desktop.getByRole('button', { name: /Prepare repair/ }).click();
            await desktop.getByRole('heading', { name: 'Repair only the failed fields.' }).waitFor();
            await desktop.screenshot({ path: 'ui-baseline/technical-repair-1440.png', fullPage: true });

            await desktop.getByRole('button', { name: /Approve and re-run/ }).click();
            await desktop.getByText('Source recovered and re-verified').waitFor();
            await desktop.screenshot({ path: 'ui-baseline/technical-recovered-1440.png', fullPage: true });

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            await mobile.request.post('http://127.0.0.1:8787/api/demo/reset');
            await mobile.goto('http://127.0.0.1:5173');
            await mobile.getByRole('heading', { name: /cooling locations/i }).waitFor();
            await mobile.screenshot({ path: 'ui-baseline/public-390.png', fullPage: true });

            await mobile.goto('http://127.0.0.1:5173/?view=technical');
            await mobile.getByRole('heading', { name: 'Source integrity' }).waitFor();
            await mobile.screenshot({ path: 'ui-baseline/technical-healthy-390.png', fullPage: true });

            await mobile.getByRole('button', { name: /Simulate drift/ }).click();
            await mobile.getByLabel('Quarantine branch').getByText('Candidate quarantined').waitFor();
            await mobile.screenshot({ path: 'ui-baseline/technical-drift-390.png', fullPage: true });

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: coolpath-ui-baseline
          path: ui-baseline
          if-no-files-found: error
