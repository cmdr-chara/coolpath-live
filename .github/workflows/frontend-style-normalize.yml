name: Frontend style normalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.head_ref == 'frontend/reference-led-redesign' && !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove empty media/support blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r'(?ms)^\s*@(media|supports)\s*[^\{]+\{\s*\}\s*')
          for path in Path('apps/web/src/styles').glob('*.css'):
              text = path.read_text()
              while True:
                  cleaned = pattern.sub('', text)
                  if cleaned == text:
                      break
                  text = cleaned
              path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/web/src/styles.css 'apps/web/src/styles/*.css'
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/frontend-style-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css apps/web/src/styles
          git commit -m "Normalize cleaned frontend styles"
          git push origin HEAD:frontend/reference-led-redesign
