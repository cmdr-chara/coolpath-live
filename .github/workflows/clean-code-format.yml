name: Clean-code formatter

on:
  push:
    branches: [agent/best-clean-code-polish]
    paths: [.github/workflows/clean-code-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the complete repository
        run: |
          rm .prettierignore
          pnpm format:write
          rm .github/workflows/clean-code-format.yml
      - name: Verify formatted sources
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm format
          git diff --check
      - name: Commit formatting cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: enforce repository-wide formatting"
          git push origin HEAD:agent/best-clean-code-polish
