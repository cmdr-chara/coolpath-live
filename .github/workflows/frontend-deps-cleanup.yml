name: Frontend dependency cleanup

on:
  push:
    branches: [frontend/reference-led-redesign]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Apply frontend dependency cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update web dependencies
        run: |
          pnpm --filter @coolpath/web remove @fontsource-variable/newsreader
          pnpm --filter @coolpath/web add '@coolpath/domain@workspace:*'
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/frontend-deps-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git commit -m "Apply frontend dependency cleanup"
          git push origin HEAD:frontend/reference-led-redesign
