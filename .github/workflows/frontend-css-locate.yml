name: Locate remaining dead frontend selectors

on:
  push:
    branches: [frontend/reference-led-redesign]

permissions:
  contents: write

jobs:
  locate:
    if: ${{ !contains(github.event.head_commit.message, 'Locate remaining dead CSS') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - name: Record exact selector locations
        run: |
          python - <<'PY'
          from pathlib import Path

          names = [
              'directory-intro', 'incident-meta', 'integrity-header', 'integrity-header__title',
              'integrity-identity', 'integrity-state', 'operations-grid', 'run-register',
              'status-banner', 'status-banner__meta', 'timeline-event', 'timeline-register'
          ]
          lines = []
          for path in sorted(Path('apps/web/src/styles').glob('*.css')):
              for number, text in enumerate(path.read_text().splitlines(), 1):
                  if any('.' + name in text for name in names):
                      lines.append(f'{path}:{number}: {text}')
          Path('apps/web/CSS-DEAD-LOCATIONS.tmp').write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit locations and remove one-shot workflow
        run: |
          rm -f apps/web/CSS-AUDIT-V2.tmp
          git rm .github/workflows/frontend-css-locate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/CSS-DEAD-LOCATIONS.tmp
          git add -u apps/web/CSS-AUDIT-V2.tmp
          git commit -m "Locate remaining dead CSS"
          git push origin HEAD:frontend/reference-led-redesign
