name: One-shot Prettier fix

on:
  push:
    branches: [frontend/reference-led-redesign]
    paths:
      - .github/workflows/one-shot-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/reference-led-redesign
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the two failing components
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/DirectoryView.tsx
          apps/web/src/components/SiteList.tsx
      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          apps/web/src/components/DirectoryView.tsx
          apps/web/src/components/SiteList.tsx
      - run: git diff --check
      - name: Commit formatted files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-prettier-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/DirectoryView.tsx apps/web/src/components/SiteList.tsx .github/workflows/one-shot-prettier-fix.yml
          git commit -m "style: format frontend location components"
          git push origin HEAD:frontend/reference-led-redesign
