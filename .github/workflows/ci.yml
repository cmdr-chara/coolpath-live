name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show App formatter correction
        run: |
          pnpm exec prettier --write apps/web/src/App.tsx
          git --no-pager diff -- apps/web/src/App.tsx
          exit 1
      - run: pnpm verify
      - run: git diff --check
      - run: git diff --check origin/main...HEAD

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  report:
    if: ${{ always() }}
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate verification status
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const successful =
              process.env.VERIFY_RESULT === "success" && process.env.E2E_RESULT === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: successful ? "success" : "failure",
              context: "CoolPath / full verification",
              description: successful
                ? "Typecheck, tests, lint, format, build and E2E passed"
                : `verify=${process.env.VERIFY_RESULT}, e2e=${process.env.E2E_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
