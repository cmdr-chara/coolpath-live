<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Philadelphia park and skyline illustration</title>
  <desc id="desc">A tree-lined cooling corridor with a distant Philadelphia skyline in soft green and blue tones.</desc>
  <defs>
